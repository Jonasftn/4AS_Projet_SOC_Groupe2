description = DM-AD-008 - Détection des modifications des attributs de délégation Kerberos dans Active Directory
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = SA-BUILD
request.ui_dispatch_view = search
search = index=main host="DC.test.local" (EventCode=5136 OR EventCode=4738)\
| rex field=_raw "LDAP Display Name:[ \t]*(?<attribut5136>[^\r\n]+)"\
| rex field=_raw "Account Name:[ \t]*(?<compte>[^\r\n]+)"\
| rex field=_raw "DN:[ \t]*(?<objet5136>[^\r\n]+)"\
| rex field=_raw "Value:[ \t]*(?<valeur5136>[^\r\n]+)"\
| rex field=_raw "AllowedToDelegateTo:[ \t\r\n]+(?<delegation4738>[^\r\n]+)"\
| rex field=_raw "Target Account:[\s\S]*?Account Name:[ \t]*(?<cible4738>[^\r\n]+)"\
| eval attribut=if(EventCode=4738,"msDS-AllowedToDelegateTo",attribut5136)\
| eval objet=if(EventCode=4738,cible4738,objet5136)\
| eval valeur=if(EventCode=4738,delegation4738,valeur5136)\
| where (EventCode=5136 AND (attribut="msDS-AllowedToDelegateTo" OR attribut="msDS-AllowedToActOnBehalfOfOtherIdentity")) OR (EventCode=4738 AND isnotnull(valeur) AND trim(valeur)!="-")\
| eval regle="DM-AD-008", severite="HIGH", detection="Kerberos Delegation Modification"\
| table _time, regle, severite, detection, compte, objet, attribut, valeur\
| sort - _time

[[BUILD] [MEDIUM] DNS tunneling - volume et longueur anormaux]
