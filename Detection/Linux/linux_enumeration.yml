title: Multiples commandes d'enumeration locale
id: DM-LIN-001
status: draft
description: >
  Detecte plusieurs commandes de decouverte distinctes lancees en peu de temps par un meme utilisateur.
author: Groupe 2 - Killian MUNT-BURON
date: 2026/11/02
modified: 2026/11/06
references:
- https://attack.mitre.org/techniques/T1082/
- https://attack.mitre.org/techniques/T1033/
- https://attack.mitre.org/techniques/T1016/
- https://attack.mitre.org/techniques/T1049/
- https://attack.mitre.org/techniques/T1069/
- https://attack.mitre.org/techniques/T1087/
- https://attack.mitre.org/techniques/T1018/
tags:
- attack.discovery
- attack.t1082
- attack.t1033
- attack.t1016
- attack.t1049
- attack.t1069
- attack.t1087
- attack.t1018
killchain: Reconnaissance interne
attack_summary:
  mechanism: L'attaquant enchaine id, whoami, uname, ip, sudo -l... apres obtention d'un shell.
  attacker_prerequisites: Shell sur l'hote.
  environment_prerequisites: Kunai installe sur tous les serveurs Linux.
  complexity: faible
logsource:
  product: linux
  category: process_creation
  service: kunai
detection:
  selection:
    info.event.name: execve
    data.command_line|re: '^(?:(?:sudo|doas|pkexec|time|watch)\s+)?(?:\S*/)?(?:id|whoami|uname|hostname|ip|ss|ps|w|who|crontab|getent|lsblk|arp|groups|netstat|ifconfig|route|df|mount|env|set|history|last)(?:\s|$)'
  condition: selection
  correlation:
    type: value_count
    group-by:
    - info.host.name
    - info.task.user
    field: cmd
    timespan: 5m
    condition: '>= 4 commandes distinctes'
data_requirements:
- source: kunai (JSON)
  event_ids:
  - execve
  audit_policy: Collecte Kunai
  collected_on: serveurs Linux
  verified_in_splunk: true
  notes: Extraction via rex/mvexpand pour gerer les JSON multiples fusionnes par Splunk. Nettoyage des wrappers (sudo, doas, time) avant extraction de la commande.
fields:
- info.host.name
- info.task.user
- nb_cmd
- commandes
level: low
severity_rationale: >
  Signe precoce de post-exploitation mais bruit possible. LOW, MEDIUM si l'hote est le bastion.
severity_modifiers:
- +1 si l'actif est critique (DC, bastion) ou si un compte privilegie ou VIP est implique
- +1 si plusieurs regles se declenchent pour la meme source
falsepositives:
- Scripts d'inventaire
- Administrateurs
exclusions:
  mechanism: lookup CSV d'utilisateurs (DM-LIN-001_exclusions.csv, colonnes user,exclude, dans SA_BUILD/lookups)
  entries: []
known_evasions:
- Commandes etalees dans le temps
- Binaires renommes
- Rafale a cheval sur deux executions planifiees
design_choice: >
  Seuil sur le nombre de commandes distinctes pour reduire le bruit. Abaisse a 4 commandes avec un dictionnaire elargi pour rattraper les enumerations ciblees.
splunk:
  alert_name: '[BUILD] [LOW] Multiples commandes d''enumeration locale'
  app: SA_BUILD
  sharing: app
  index: main
  cron: '*/5 * * * *'
  earliest: -10m@m
  latest: -5m@m
  trigger: number of results > 0
  trigger_mode: for_each_result
  throttle:
    fields: info.host.name,info.task.user
    period: 1h
  webhook_url: http://soc_n8n:5678/webhook/alert
  search: |
    index=main sourcetype=kunai
    | rex max_match=0 field=_raw "(?<obj>\{\"data\":.*?\"utc_time\":\"[^\"]+\"\}\})"
    | mvexpand obj
    | spath input=obj path=info.event.name output=ev
    | search ev="execve"
    | spath input=obj path=data.command_line output=cl
    | spath input=obj path=info.host.name output=srv
    | spath input=obj path=info.task.user output=usr
    | eval cl_clean=replace(cl, "^(?i)(sudo|doas|pkexec|time|watch)\s+", "")
    | eval cmd=replace(mvindex(split(cl_clean, " "), 0), "^.*/", "")
    | where cmd IN ("id","whoami","uname","hostname","ip","ss","ps","w","who","crontab","getent","lsblk","arp","groups","netstat","ifconfig","route","df","mount","env","set","history","last")
    | lookup DM-LIN-001_exclusions.csv user AS usr OUTPUT exclude
    | where isnull(exclude)
    | stats dc(cmd) as nb_cmd values(cl) as commandes earliest(_time) as _time by srv, usr
    | rename srv AS "info.host.name", usr AS "info.task.user"
    | where nb_cmd>=4
    | table _time info.host.name info.task.user nb_cmd commandes
response:
  containment:
  - Verifier la session SSH associee et la terminer si non legitime
  remediation:
  - Restreindre sudo
  - Revue des acces SSH
  do_not:
  - Ne pas tuer le shell avant d'avoir recupere son historique
investigation:
  playbook: Investigation/fiches_reflexes/DM-LIN-001.md
  pivots:
  - P-USER-LOGONS
  - P-PROC-TREE
  - P-SRC-IP-SCOPE
  client_notification: non - qualification sous 12h (SLA LOW)
tests:
- date: 2026/11/04
  environment: Fichier json simulé d'evenements Kunai 
  command: 'id; whoami; uname -a; hostname; ip a; ps aux (hote Linux de test)'
  expected: 6 commandes distinctes, alerte LOW dans Splunk puis DFIR-IRIS
  result: responds bien à la regle de correlation DM-LIN-001
  evidence: Regarder dans le rapport les différents images et les fichiers csv.
- date: 2026/11/05
  environment: VM Ubuntu cible avec Kunai reel
  command: 'sudo id; df -h; env; last'
  expected: 4 commandes distinctes detectees malgre sudo, declenchement de l'alerte
  result: Succes, la regle decoupe bien le JSON et identifie les commandes sous-jacentes.
untestable_reason: ''
