search = index=main sourcetype=*kunai* | spath\
    | search info.event.name="execve"\
    | eval cl=mvindex('data.command_line', 0), srv=mvindex('info.host.name', 0), usr=mvindex('info.task.user', 0)\
    | eval cmd=replace(mvindex(split(cl, " "), 0), "^.*/", "")\
    | where cmd IN ("id","whoami","uname","hostname","ip","ss","ps","w","who","crontab","getent","lsblk","arp","groups")\
