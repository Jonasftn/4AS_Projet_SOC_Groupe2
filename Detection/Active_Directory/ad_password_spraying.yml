title: Password spraying
id: DM-AD-004
status: test
description: >
  Detecte une meme source reseau qui echoue a s'authentifier sur de nombreux comptes differents en peu de temps (echecs 4625), signature d'une attaque par pulverisation de mot de passe.
author: Groupe 2 - Amelie SAUVAN-MAGNET
date: 2026/11/02
modified: 2026/11/04
references:
- https://attack.mitre.org/techniques/T1110/003/
tags:
- attack.credential_access
- attack.t1110.003
killchain: Acces aux identifiants
attack_summary:
  mechanism: Un mot de passe courant est teste sur beaucoup de comptes depuis une meme source, avec peu d'essais par compte pour eviter le verrouillage.
  attacker_prerequisites: Une liste de comptes valides du domaine et un acces reseau au DC.
  environment_prerequisites: Audit des echecs d'ouverture de session actif, journal Security collecte.
  complexity: faible
logsource:
  product: windows
  category: authentication_failure
  service: security
data_requirements:
- source: WinEventLog:Security
  event_ids:
  - '4625'
  audit_policy: 'Audit Logon : Failure'
  collected_on: DC
  verified_in_splunk: true
  notes: Echec d'ouverture de session, champ Account_Name et Source_Network_Address
detection:
  selection:
    EventID: 4625
  condition: selection
  timeframe: 15m
  group_by: Source_Network_Address
  threshold: distinct_count(Account_Name) >= 5
fields:
- Source_Network_Address
- host
- nb_comptes
- comptes
- nb_echecs
level: medium
severity_rationale: >
  Tentative de compromission sans succes avere au moment de la detection. MEDIUM.
severity_modifiers:
- +1 si une authentification reussie (4624) depuis la meme IP suit la vague d'echecs (compte compromis)
- +1 si l'IP source est interne (poste deja compromis)
falsepositives:
- Scanner de vulnerabilites ou outil de supervision
- Compte de service mal configure qui rejoue un ancien mot de passe
exclusions:
  mechanism: lookup CSV des IP legitimes connues
  entries: []
known_evasions:
- Spraying lent sous le seuil (moins de 5 comptes par fenetre)
- Repartition de l'attaque sur plusieurs IP sources
design_choice: >
  Le regroupement se fait par IP source sur une fenetre de 15 minutes, avec un seuil sur le nombre de comptes distincts vises (et non le nombre d'essais), ce qui distingue le spraying d'un brute force ciblant un seul compte.
splunk:
  alert_name: '[BUILD] [MEDIUM] Password spraying'
  app: SA_BUILD
  sharing: app
  index: main
  cron: '*/5 * * * *'
  earliest: -15m
  latest: now
  trigger: number of results > 0
  trigger_mode: once
  webhook_url: http://soc_n8n:5678/webhook/alert
  search: |
    index=main source="WinEventLog:Security" EventCode=4625
    | eval compte=mvfilter(Account_Name!="-" AND Account_Name!="*$")
    | stats dc(compte) as nb_comptes values(compte) as comptes count as nb_echecs by Source_Network_Address, host
    | where nb_comptes >= 5
    | sort - nb_comptes
response:
  containment:
  - Bloquer l'IP source
  - Surveiller les comptes vises et forcer le reset de tout compte ou un 4624 a suivi
  remediation:
  - Identifier l'origine de l'IP source (poste interne compromis ?)
  - Verifier si un compte a ete effectivement compromis
  do_not:
  - Ne pas ignorer l'alerte meme sans succes apparent
investigation:
  playbook: Investigation/fiches_reflexes/DM-AD-004.md
  pivots:
  - P-SRC-IP-SCOPE
  - P-ACCOUNT-ACTIVITY
  - P-LOGON-SUCCESS
  client_notification: oui - qualification sous 8h (SLA MEDIUM)
tests:
- date: 2026/11/04
  environment: lab DC/SRV/Kali
  command: crackmapexec smb 192.168.20.100 -u users.txt -p 'Spray2026!'
  expected: Alerte MEDIUM dans Splunk puis DFIR-IRIS
  result: OK
  evidence: Tests/validation_environnement/DM-AD-004.csv ; Tests/validation_environnement/captures/DM-AD-004.png
untestable_reason: ''
changelog:
- date: 2026/11/02
  author: Amelie SAUVAN-MAGNET
  change: Creation (draft)
- date: 2026/11/04
  author: Amelie SAUVAN-MAGNET
  change: Test valide en labo, passage en status test
