title: Password spraying - echecs d'authentification sur de nombreux comptes
id: DM-AD-004
status: draft
description: >
  Detecte une meme source qui echoue a s'authentifier sur au moins 10 comptes differents en 15 minutes (4625, 4771, 4776), avec peu d'essais par compte.
author: Groupe 2 - Amélie SAUVAN-MAGNET
date: 2026/11/02
modified: 2026/11/02
references:
- https://attack.mitre.org/techniques/T1110/003/
tags:
- attack.credential_access
- attack.t1110.003
killchain: Acces aux identifiants / acces initial
attack_summary:
  mechanism: Un mot de passe courant est teste sur de nombreux comptes pour eviter le verrouillage.
  attacker_prerequisites: Liste de comptes et acces a un service d'authentification (SMB, Kerberos, RDP, LDAP).
  environment_prerequisites: Politique de verrouillage permissive.
  complexity: faible
logsource:
  product: windows
  category: authentication
  service: security
data_requirements:
- source: WinEventLog:Security
  event_ids:
  - '4625'
  - '4771'
  - '4776'
  audit_policy: 'Audit Logon, Credential Validation, Kerberos Authentication Service : Success and Failure'
  collected_on: DC (4771, 4776) et serveurs (4625)
  verified_in_splunk: false
  notes: 'Account_Name est multi-valeur sur 4625: le compte cible est la derniere valeur.'
detection:
  selection:
    EventID:
    - 4625
    - 4771
    - 4776
  timeframe: 15m
  condition: selection | count(TargetUserName) by SourceIp > 10
fields:
- src_ip
- nb_comptes
- nb_echecs
- comptes
level: medium
severity_rationale: >
  Tentative de compromission de comptes sans resultat avere. MEDIUM; HIGH si un 4624 reussi suit depuis la meme IP.
severity_modifiers:
- +1 si l'actif est critique (DC, bastion) ou si un compte privilegie ou VIP est implique
- +1 si plusieurs regles se declenchent pour la meme source
falsepositives:
- Scanner de vulnerabilites
- Supervision
- Serveur avec mot de passe expire
exclusions:
  mechanism: lookup CSV d'IP a exclure
  entries: []
known_evasions:
- Spraying tres lent (< 10 comptes par fenetre)
- Utilisation de plusieurs IP sources
design_choice: >
  Le ratio echecs/comptes evite de confondre avec un brute force sur un seul compte.
splunk:
  alert_name: '[BUILD] [MEDIUM] Password spraying - echecs d''authentification sur de nombreux comptes'
  app: SA_BUILD
  sharing: app
  index: main
  cron: '*/15 * * * *'
  earliest: -30m@m
  latest: -15m@m
  trigger: number of results > 0
  trigger_mode: once
  throttle:
    fields: src_ip
    period: 1h
  webhook_url: http://soc_n8n:5678/webhook/alert
  search: |
    index=main source="WinEventLog:Security" (EventCode=4625 OR EventCode=4771 OR EventCode=4776)
    | eval target=mvindex(Account_Name, -1), src_ip=replace(coalesce(Source_Network_Address, Client_Address), "::ffff:", "")
    | where isnotnull(src_ip) AND src_ip!="-" AND src_ip!=""
    | bin _time span=15m
    | stats dc(target) as nb_comptes count as nb_echecs values(target) as comptes by _time, src_ip
    | where nb_comptes>=10 AND nb_echecs<=nb_comptes*3
response:
  containment:
  - Bloquer l'IP source au pare-feu
  - Verifier les comptes cibles pour un succes ulterieur
  remediation:
  - Mots de passe robustes et MFA
  - Politique de verrouillage adaptee
  do_not:
  - Ne pas verrouiller en masse les comptes cibles sans prevenir le client
investigation:
  playbook: Investigation/fiches_reflexes/DM-AD-004.md
  pivots:
  - P-SRC-IP-SCOPE
  - P-USER-LOGONS
  - P-LOGON-SESSION
  client_notification: non - qualification sous 8h (SLA MEDIUM)
tests:
- date: ''
  environment: lab DC/SRV/Kali
  command: netexec smb 192.168.10.100 -u users.txt -p 'Automne2026!' (>= 10 comptes)
  expected: Alerte MEDIUM dans Splunk puis DFIR-IRIS
  result: non teste
  evidence: ''
untestable_reason: ''
changelog:
- date: 2026/11/02
  author: Amélie SAUVAN-MAGNET
  change: Creation (draft)
