title: DM-WIN-007 - Effacement des journaux d'evenements
severite: high
logsource:
  product: windows
  service: security
  category: eventlog
detection:
  selection_log:
    EventID:
      - 1102
      - 104
  selection_cli:
    CommandLine|contains:
      - wevtutil cl
      - wevtutil clear-log
      - Clear-EventLog
  condition: selection_log or selection_cli
