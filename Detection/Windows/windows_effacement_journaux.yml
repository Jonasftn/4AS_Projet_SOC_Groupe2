title: Effacement des journaux d'evenements
id: DM-WIN-007
status: draft
description: >
  Detecte l'effacement des journaux Security (1102), System (104) ou via wevtutil cl / Clear-EventLog.
author: Groupe 2 - Amélie SAUVAN-MAGNET
date: 2026/11/02
modified: 2026/11/02
references:
- https://attack.mitre.org/techniques/T1070/001/
tags:
- attack.defense_evasion
- attack.t1070.001
killchain: Evasion de defense
attack_summary:
  mechanism: L'attaquant efface les journaux pour supprimer les traces de son activite.
  attacker_prerequisites: Droits administrateur.
  environment_prerequisites: Journaux locaux modifiables.
  complexity: faible
logsource:
  product: windows
  category: eventlog
  service: security
data_requirements:
- source: WinEventLog:Security
  event_ids:
  - '1102'
  audit_policy: Audit Other Policy Change Events / evenement natif
  collected_on: tous
  verified_in_splunk: false
  notes: 1102 est journalise par defaut.
- source: WinEventLog:System
  event_ids:
  - '104'
  audit_policy: Journal System
  collected_on: tous
  verified_in_splunk: false
  notes: ''
- source: WinEventLog:Microsoft-Windows-Sysmon/Operational
  event_ids:
  - '1'
  audit_policy: Process Creation
  collected_on: tous
  verified_in_splunk: false
  notes: wevtutil cl / Clear-EventLog
detection:
  selection_log:
    EventID:
    - 1102
    - 104
  selection_cli:
    CommandLine|contains:
    - wevtutil cl
    - wevtutil clear-log
    - Clear-EventLog
  condition: selection_log or selection_cli
fields:
- ComputerName
- User
- EventCode
- CommandLine
level: high
severity_rationale: >
  Signe fort de dissimulation apres intrusion. HIGH, CRITICAL sur un DC.
severity_modifiers:
- +1 si l'actif est critique (DC, bastion) ou si un compte privilegie ou VIP est implique
- +1 si plusieurs regles se declenchent pour la meme source
falsepositives:
- Maintenance planifiee
exclusions:
  mechanism: lookup CSV des comptes de maintenance
  entries: []
known_evasions:
- Arret du service Event Log avant action
design_choice: >
  Regle simple et peu bruyante dans une PME.
splunk:
  alert_name: '[BUILD] [HIGH] Effacement des journaux d''evenements'
  app: SA_BUILD
  sharing: app
  index: main
  cron: '*/5 * * * *'
  earliest: -10m@m
  latest: -5m@m
  trigger: number of results > 0
  trigger_mode: once
  throttle:
    fields: ComputerName
    period: 1h
  webhook_url: http://soc_n8n:5678/webhook/alert
  search: |
    index=main ((source="WinEventLog:Security" EventCode=1102) OR (source="WinEventLog:System" EventCode=104)
    OR (source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine="*wevtutil*cl*" OR CommandLine="*wevtutil*clear-log*" OR CommandLine="*Clear-EventLog*")))
    | table _time ComputerName source EventCode User Image CommandLine
response:
  containment:
  - Isoler l'hote
  - Verifier la copie centralisee des journaux dans Splunk
  remediation:
  - Restreindre les droits sur les journaux
  do_not:
  - 'Ne pas se fier aux journaux locaux: utiliser la copie Splunk'
investigation:
  playbook: Investigation/fiches_reflexes/DM-WIN-007.md
  pivots:
  - P-USER-LOGONS
  - P-LOGON-SESSION
  - P-PROC-TREE
  client_notification: oui - notification client sous 2h (SLA HIGH), qualification sous 4h
tests:
- date: ''
  environment: lab DC/SRV/Kali
  command: wevtutil cl Security
  expected: Alerte HIGH dans Splunk puis DFIR-IRIS
  result: non teste
  evidence: ''
untestable_reason: ''
changelog:
- date: 2026/11/02
  author: Amélie SAUVAN-MAGNET
  change: Creation (draft)
