| eval requete=lower(trim(QueryName, "."))\
| where NOT match(requete, "[.](in-addr|ip6)[.]arpa$")\
| rex field=requete "^(?<sous_domaine>.+?)[.](?<domain>[^.]+[.](?:(?:co|com|org|net|gov|ac|edu)[.][a-z]{2}|[^.]+))$"\
| where isnotnull(domain)\
