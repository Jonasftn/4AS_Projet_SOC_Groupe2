title: Recherche de secrets et mots de passe
id: DM-LIN-002
status: draft
description: >
  Detecte les commandes qui recherchent des mots de passe, cles ou fichiers de secrets sur le systeme,
  avec les outils natifs (grep, find, cat...) ou des outils dedies (LaZagne, trufflehog, gitleaks, mimipenguin).
author: Groupe 2 - Killian MUNT-BURON
date: 2026/11/02
modified: 2026/11/06
references:
- https://attack.mitre.org/techniques/T1552
tags:
- attack.credential_access
- attack.t1552
killchain: Acces aux identifiants
attack_summary:
  mechanism: grep/find/cat/less/head/tail sur des fichiers de configuration, cles SSH, historiques, ou outils comme LaZagne, trufflehog, gitleaks et mimipenguin.
  attacker_prerequisites: Shell sur l'hote.
  environment_prerequisites: LINSERV-DEV heberge le depot de code et les secrets.
  complexity: faible
logsource:
  product: linux
  category: process_creation
  service: kunai
data_requirements:
- source: kunai (JSON)
  event_ids:
  - execve
  audit_policy: Collecte Kunai
  collected_on: serveurs Linux
  verified_in_splunk: true
  notes: Extraction via rex/mvexpand pour gerer les JSON multiples fusionnes par Splunk. Variables temporaires (cl, srv, usr) extraites via spath puis renomees pour l'affichage final.
detection:
  selection_native:
    info.event.name: execve
    data.command_line|re: '(?i)^\s*(sudo\s+)?(/usr/bin/|/bin/)?(grep|egrep|fgrep|rg|find|locate|cat|less|more|head|tail|strings)\s.*(passw(or)?d\b|\bsecrets?\b|\btoken|api_key|id_rsa|id_ed25519|[.]kdbx|[.]pem\b|[.]git-credentials|[.]aws/credentials|bash_history|wp-config|[.]env\b)'
  filter_system_files:
    data.command_line|re: '(?i)(/etc/passwd|/etc/pam[.]d|/etc/shadow-)'
  selection_tools:
    info.event.name: execve
    data.command_line|re: '(?i)(^|/|\s)(lazagne|trufflehog|gitleaks|mimipenguin)([.]py)?(\s|$)'
  condition: (selection_native and not filter_system_files) or selection_tools
fields:
- _time
- info.host.name
- info.task.user
- data.command_line
level: high
severity_rationale: >
  Prepare un deplacement lateral avec identifiants. HIGH.
severity_modifiers:
- +1 si l'actif est critique (DC, bastion) ou si un compte privilegie ou VIP est implique
- +1 si plusieurs regles se declenchent pour la meme source
falsepositives:
- Scanners de secrets lances par l'equipe DevOps (trufflehog, gitleaks en CI/CD)
- Scripts d'administration ou de conformite
- Administrateurs
exclusions:
  mechanism: lookup CSV d'utilisateurs (DM-LIN-002_exclusions.csv, colonnes user,exclude, dans SA_BUILD/lookups)
  entries: []
known_evasions:
- Lecture directe d'un fichier sans passer par un motif liste
- Autres binaires de lecture ou de copie (cp, scp, base64, python, awk, sed)
- Commande obfusquee ou encodee
- Binaires renommes
design_choice: >
  Motifs ancres sur le binaire en debut de commande pour limiter les faux positifs, exclusion des
  fichiers systeme courants et whitelist par lookup. 
splunk:
  alert_name: '[BUILD] [HIGH] Recherche de secrets et mots de passe'
  app: SA_BUILD
  sharing: app
  index: main
  cron: '*/5 * * * *'
  earliest: -10m@m
  latest: -5m@m
  trigger: number of results > 0
  trigger_mode: for_each_result
  throttle:
    fields: info.host.name,info.task.user
    period: 30m
  webhook_url: http://soc_n8n:5678/webhook/alert
  search: |
    index=main sourcetype=kunai
    | rex max_match=0 field=_raw "(?<obj>\{\"data\":.*?\"utc_time\":\"[^\"]+\"\}\})"
    | mvexpand obj
    | spath input=obj path=info.event.name output=ev
    | search ev="execve"
    | spath input=obj path=data.command_line output=cl
    | spath input=obj path=info.host.name output=srv
    | spath input=obj path=info.task.user output=usr
    | eval cmd=cl
    | where isnotnull(cmd)
    | where (match(cmd, "(?i)^\s*(sudo\s+)?(/usr/bin/|/bin/)?(grep|egrep|fgrep|rg|find|locate|cat|less|more|head|tail|strings)\s.*(passw(or)?d\b|\bsecrets?\b|\btoken|api_key|id_rsa|id_ed25519|[.]kdbx|[.]pem\b|[.]git-credentials|[.]aws/credentials|bash_history|wp-config|[.]env\b)") AND NOT match(cmd, "(?i)(/etc/passwd|/etc/pam[.]d|/etc/shadow-)")) OR match(cmd, "(?i)(^|/|\s)(lazagne|trufflehog|gitleaks|mimipenguin)([.]py)?(\s|$)")
    | lookup DM-LIN-002_exclusions.csv user AS usr OUTPUT exclude
    | where isnull(exclude)
    | rename srv AS "info.host.name", usr AS "info.task.user", cl AS "data.command_line"
    | table _time info.host.name info.task.user data.command_line
response:
  containment:
  - Isoler l'hote
  - Revoquer les secrets potentiellement exposes (fichiers, cles SSH, tokens, mots de passe, ...)
  remediation:
  - Generation de nouveaux secrets et mots de passe.
  - Privilegier l'utilisation de coffres de secrets plutot que de fichiers.
  do_not:
  - Ne pas supprimer les fichiers consultes avant collecte
investigation:
  playbook: Investigation/fiches_reflexes/DM-LIN-002.md
  pivots:
  - P-USER-LOGONS
  - P-PROC-TREE
  - P-SRC-IP-SCOPE
  client_notification: oui - notification client sous 2h (SLA HIGH), qualification sous 4h
tests:
- date: 2026/11/04
  environment: Fichier json simulé d'evenements Kunai 
  command: 'grep -ri password /home ; find / -name id_rsa (hote Linux de test)'
  expected: Alerte HIGH dans Splunk puis DFIR-IRIS
  result: reponds bien à la regle de correlation DM-LIN-002
  evidence: Regarder dans le rapport les différents images et les fichiers csv.
- date: 2026/11/04
  environment: Fichier json simulé d'evenements Kunai
  command: 'cat /etc/passwd ; cd $(pwd) (hote Linux de test)'
  expected: Aucune alerte
  result: pas d'alerte, reponds bien à la regle de correlation DM-LIN-002
  evidence: Regarder dans le rapport les différents images et les fichiers csv.
- date: 2026/11/05
  environment: Environnement de test avec Kunai reel
  command: 'sudo find / -name id_rsa ; sudo grep -ri password /'
  expected: Alerte HIGH dans Splunk puis DFIR-IRIS
  result: Succes, la regle decoupe bien le JSON et identifie les commandes sous-jacentes.
  evidence: Regarder dans le rapport les différents images et les fichiers csv.
